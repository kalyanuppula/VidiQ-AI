[project]
name = "vidiq-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.33",
    "faster-whisper==1.2.1",
    "google-genai==2.34.0",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
